name: Testes de API

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PORT: 3000
      BASE_URL: http://127.0.0.1:3000
      MONGODB_URI: mongodb://127.0.0.1:27017/gestao-de-alunos-test
      ADMIN_EMAIL: admin@escola.com
      ADMIN_SENHA: admin123

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Iniciar API e aguardar disponibilidade
        run: |
          npm start > api.log 2>&1 &
          for tentativa in {1..30}; do
            if curl --fail --silent "$BASE_URL" > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat api.log
          exit 1

      - name: Executar testes
        run: npm test

      - name: Mostrar log da API em caso de falha
        if: failure()
        run: cat api.log || true
